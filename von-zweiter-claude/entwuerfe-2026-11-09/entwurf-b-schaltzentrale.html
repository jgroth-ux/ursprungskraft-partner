[hidden]{display:none!important}:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.entwurf-wahl{position:fixed;z-index:90;top:14px;right:14px;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(31,36,24,.86);font:600 12px/1 Inter,sans-serif}
.entwurf-wahl button{border:0;background:none;color:#CFC4A0;padding:9px 14px;border-radius:999px;transition:background .3s,color .3s}
.entwurf-wahl button[aria-pressed=true]{background:#FBF9F4;color:#2F3524}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Entwurf B, Schaltzentrale: dunkel, alles Wichtige auf einem Bildschirm. Felder in verschiedenen Größen, die sich beim Klick öffnen.
   Kein Seitenmenü, sondern eine Leiste unten, deren Symbole unter der Maus wachsen. */
html,body{height:100%}
body{background:var(--tief);color:var(--surface);overflow-x:hidden}
.oben{display:flex;align-items:center;gap:14px;height:68px;padding:0 clamp(16px,2.4vw,36px)}
.oben img{width:34px;height:34px}.oben b{font:500 18px/1 Jost,sans-serif}.oben span{color:var(--khaki-l);font-size:14px;margin-left:6px}
.feld-raster{display:grid;gap:12px;padding:0 clamp(16px,2.4vw,36px) 120px;grid-template-columns:minmax(0,1fr)}
.feld{position:relative;overflow:hidden;border-radius:22px;background:var(--deep);padding:26px;text-align:left;border:0;display:flex;flex-direction:column;min-height:180px;
  opacity:0;transform:scale(.94) translateY(18px);animation:feld .9s var(--aus) forwards;animation-delay:calc(var(--i)*70ms);transition:transform .5s var(--aus),background .4s}
@keyframes feld{to{opacity:1;transform:none}}
.feld:hover{transform:translateY(-4px);background:#353C28}.feld:active{transform:scale(.985)}
.feld .name{font:600 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki-l);display:flex;justify-content:space-between;align-items:center}
.feld .name svg{opacity:0;transform:translate(-6px,6px);transition:opacity .35s,transform .5s var(--aus)}.feld:hover .name svg{opacity:1;transform:none}
.feld h2{font-size:28px;line-height:1.1;letter-spacing:-.015em}.feld p{color:rgba(251,249,244,.66);font-size:15px;line-height:1.5}
.unten{margin-top:auto}
@media (max-width:700px){.oben span{display:none}.oben{padding-right:200px}.oben b{font-size:16px}}
/* Jetzt */
.jetzt{background:var(--surface);color:var(--ink)}.jetzt:hover{background:#fff}.jetzt .name{color:var(--olive)}.jetzt p{color:var(--muted)}
.jetzt .uhr{font:500 clamp(96px,13vw,208px)/.82 Jost,sans-serif;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin:22px 0 4px -6px;display:flex}
.jetzt .uhr span{display:inline-block;animation:ziffer .9s var(--aus) backwards;animation-delay:calc(var(--n)*80ms + 350ms)}
@keyframes ziffer{from{transform:translateY(60%);opacity:0}}
.jetzt .noch{display:inline-flex;align-items:center;gap:10px;font:600 14px/1 Inter,sans-serif;color:var(--olive);margin-bottom:22px}
.jetzt .noch i{width:9px;height:9px;border-radius:50%;background:var(--olive);animation:puls 2.4s ease-in-out infinite}
@keyframes puls{50%{transform:scale(1.9);opacity:.25}}
.jetzt h2{font-size:clamp(30px,3vw,44px)}
.pille{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px;border-radius:999px;background:var(--deep);color:var(--surface);font:600 15px/1 Inter,sans-serif;margin:22px 8px 0 0;transition:transform .4s var(--aus)}.pille.leise{background:var(--sand);color:var(--deep)}.pille:hover{transform:translateY(-2px)}
/* Woche */
.balken{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px;margin-top:22px}
.balken li{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%;font:600 12px/1 Inter,sans-serif;color:rgba(251,249,244,.55)}
.balken i{width:100%;border-radius:8px;background:rgba(251,249,244,.14);height:calc(14px + var(--h)*34px);transform:scaleY(0);transform-origin:bottom;animation:wachs 1s var(--aus) forwards;animation-delay:calc(var(--n)*70ms + 500ms)}
.balken li.heute i{background:var(--khaki-l)}.balken li.heute{color:var(--surface)}
@keyframes wachs{to{transform:none}}
/* Bildfelder */
.bild{padding:0;min-height:240px}.bild img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--aus)}.bild:hover img{transform:scale(1.07)}
.bild .schrift{position:relative;margin-top:auto;padding:70px 26px 24px;background:linear-gradient(transparent,rgba(31,36,24,.9))}
.bild .schrift .name{margin-bottom:10px}
/* Anrufe */
.ruf{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid rgba(251,249,244,.12)}
.ruf:first-of-type{margin-top:18px}
.ruf .kreis{width:44px;height:44px;border-radius:50%;background:rgba(251,249,244,.1);display:grid;place-items:center;font:500 16px/1 Jost,sans-serif}
.ruf b{display:block;font:500 19px/1.2 Jost,sans-serif}.ruf small{color:rgba(251,249,244,.6);font-size:13px}
.ruf .an{width:44px;height:44px;border-radius:50%;background:var(--khaki-l);color:var(--tief);display:grid;place-items:center;transition:transform .45s var(--aus)}.feld:hover .ruf .an{transform:rotate(-12deg) scale(1.06)}
.feld .gross{font:500 clamp(88px,9vw,150px)/.8 Jost,sans-serif;letter-spacing:-.05em;margin-top:18px;color:inherit}.jetzt .uhr{color:var(--ink)}
.lauf{height:24px;overflow:hidden;margin-top:14px;color:rgba(251,249,244,.7);font-size:15px}.lauf div{animation:lauf 9s var(--aus) infinite}.lauf span{display:block;height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes lauf{0%,28%{transform:none}33%,61%{transform:translateY(-24px)}66%,94%{transform:translateY(-48px)}100%{transform:none}}
.khaki{background:var(--khaki-l);color:var(--tief)}.khaki:hover{background:#DACFAD}.khaki .name{color:var(--deep)}.khaki p{color:var(--deep)}
@media (min-width:860px){
  body{overflow:hidden}
  .feld-raster{height:calc(100dvh - 68px);padding-bottom:112px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}
  .feld{min-height:0}
  .f-jetzt{grid-column:1/6;grid-row:1/5}.f-woche{grid-column:6/10;grid-row:1/3}.f-seite{grid-column:10/13;grid-row:1/4}
  .f-anrufe{grid-column:6/10;grid-row:3/7}.f-neu{grid-column:1/4;grid-row:5/7}.f-flyer{grid-column:4/6;grid-row:5/7}.f-news{grid-column:10/13;grid-row:4/7}
  .b-zu{grid-column:1/6;grid-row:1/5}.b-zahl1{grid-column:6/8;grid-row:1/3}.b-zahl2{grid-column:8/10;grid-row:1/3}.b-tag{grid-column:10/13;grid-row:1/4}
  .b-auf{grid-column:6/10;grid-row:3/7}.b-partner{grid-column:1/4;grid-row:5/7}.b-zahl3{grid-column:4/6;grid-row:5/7}.b-geraet{grid-column:10/13;grid-row:4/7}
}
@media (min-width:860px) and (max-height:760px){.jetzt .uhr{font-size:clamp(80px,10vw,140px)}.feld{padding:20px}.feld .gross{font-size:88px}}
/* Leiste unten: Symbole wachsen unter der Maus */
.dock{position:fixed;left:50%;bottom:22px;z-index:40;transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-radius:26px;background:rgba(251,249,244,.1);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(251,249,244,.14);animation:feld 1s .7s var(--aus) backwards}
.dock a{--g:1;position:relative;width:52px;height:52px;border-radius:16px;background:rgba(251,249,244,.1);display:grid;place-items:center;color:var(--surface);text-decoration:none;transform-origin:bottom;transform:scale(var(--g));transition:transform .18s ease-out,background .3s;margin:0 calc((var(--g) - 1)*20px)}
.dock a[aria-current]{background:var(--surface);color:var(--tief)}
.dock a span{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);padding:6px 10px;border-radius:8px;background:var(--surface);color:var(--tief);font:600 12px/1 Inter,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s,transform .3s var(--aus);pointer-events:none}.dock a:hover span{opacity:1;transform:translateX(-50%)}
/* Geöffnetes Feld */
.auf{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:clamp(12px,4vw,56px);background:rgba(20,24,15,.72);backdrop-filter:blur(10px)}
.auf-blatt{width:min(880px,100%);max-height:100%;overflow:auto;border-radius:28px;background:var(--surface);color:var(--ink);padding:clamp(26px,4vw,56px);view-transition-name:offen}
.auf-blatt .name{font:600 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);display:flex;justify-content:space-between;align-items:center}
.auf-blatt .name button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sand);display:grid;place-items:center}
.auf-blatt h2{font-size:clamp(38px,5vw,68px);line-height:1;letter-spacing:-.03em;margin:22px 0 14px}.auf-blatt p{color:var(--muted);font-size:18px;max-width:34em}
.auf-blatt ul{margin-top:26px;border-top:1px solid var(--line)}.auf-blatt li{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;font-size:17px}.auf-blatt li span{color:var(--muted)}
::view-transition-group(offen){animation-duration:.55s;animation-timing-function:var(--aus)}
</style></head>
