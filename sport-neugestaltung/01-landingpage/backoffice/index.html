<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice</title>
<!-- Backoffice für Partner (Grundlage für alle Gruppen). Inhalt kommt aus konfig-*.js, Daten aus quelle-*.js.
     Siehe LIESMICH.md und SCHNITTSTELLE.md. Alle Texte stehen in der Konfiguration, nicht hier. -->
<link rel="stylesheet" href="../schriften/schriften.css">
<link rel="stylesheet" href="backoffice.css?v=20261110b">
</head>
<body>

<div class="hinweis-demo" id="hinweis-demo" hidden></div>

<!-- Anmeldung, Passwort vergessen, Passwort festlegen -->
<main class="anmeldung" id="anmeldung" hidden>
  <div class="anmeldung-feld">
    <form id="f-login" novalidate>
      <div class="eyebrow" data-t="anmeldungEyebrow"></div>
      <h1 data-t="anmeldungTitel"></h1>
      <p class="text" data-t="anmeldungText"></p>
      <label class="eingabe">E-Mail<input name="email" type="email" autocomplete="username" required></label>
      <label class="eingabe">Passwort<input name="passwort" type="password" autocomplete="current-password" required></label>
      <div class="fehler" role="alert"></div>
      <button class="knopf breit" type="submit">Anmelden</button>
      <button class="link" type="button" data-zu="vergessen">Passwort vergessen?</button>
    </form>

    <form id="f-vergessen" novalidate hidden>
      <div class="eyebrow" data-t="anmeldungEyebrow"></div>
      <h1 data-t="vergessenTitel"></h1>
      <p class="text" data-t="vergessenText"></p>
      <label class="eingabe">E-Mail<input name="email" type="email" autocomplete="username" required></label>
      <div class="fehler" role="alert"></div>
      <p class="erfolg" role="status" hidden data-t="vergessenFertig"></p>
      <button class="knopf breit" type="submit">Link schicken</button>
      <button class="link" type="button" data-zu="login">Zurück zur Anmeldung</button>
    </form>

    <form id="f-passwort" novalidate hidden>
      <div class="eyebrow" data-t="anmeldungEyebrow"></div>
      <h1 id="passwort-titel"></h1>
      <p class="text" id="passwort-text"></p>
      <label class="eingabe">Neues Passwort<input name="passwort" type="password" autocomplete="new-password" minlength="10" required></label>
      <label class="eingabe">Noch einmal<input name="wiederholung" type="password" autocomplete="new-password" minlength="10" required></label>
      <div class="fehler" role="alert"></div>
      <button class="knopf breit" type="submit">Passwort speichern</button>
    </form>

    <div class="demo-wahl" id="demo-wahl" hidden>
      <span>Vorschau ansehen als</span>
      <div id="demo-knoepfe"></div>
    </div>
  </div>
</main>

<!-- Laden und Fehler -->
<div class="zustand" id="laden" hidden><span class="punkt"></span>Einen Moment</div>
<div class="zustand" id="fehler-laden" hidden>
  <p>Deine Anmeldungen konnten gerade nicht geladen werden.</p>
  <button class="knopf" type="button" id="nochmal">Noch einmal versuchen</button>
</div>

<!-- Übersicht -->
<div class="app" id="app" hidden>
  <header>
    <div class="innen">
      <span class="marke"><b id="kopf-name"></b><span id="kopf-rolle"></span></span>
      <span class="kopf-knoepfe">
        <button class="knopf klein leise" id="passwort-aendern" type="button">Passwort ändern</button>
        <button class="knopf klein rahmen" id="abmelden" type="button">Abmelden</button>
      </span>
    </div>
  </header>

  <main class="innen" id="oben">
    <section class="raster" aria-label="Übersicht">
      <div class="feld-gross f-gesamt">
        <div class="eyebrow" data-t="gesamt"></div>
        <b class="riesig" id="z-gesamt">0</b>
        <p class="unterzeile" id="z-woche"></p>
        <p class="stand-heute" id="z-stand"></p>
      </div>

      <div class="feld f-verlauf">
        <div class="verlauf-kopf">
          <div class="eyebrow" data-t="verlauf"></div>
          <div class="umschalter" role="group" aria-label="Zeitraum">
            <button type="button" data-zeitraum="tage" aria-pressed="true">7 Tage</button>
            <button type="button" data-zeitraum="wochen" aria-pressed="false">12 Wochen</button>
          </div>
        </div>
        <div class="balken" id="balken" role="img"></div>
        <div class="tooltip" id="tooltip" hidden></div>
      </div>

      <a class="feld f-seite" id="seite-link" target="_blank" rel="noopener">
        <img id="seite-foto" alt="">
        <span class="f-seite-text"><span class="eyebrow" data-t="seite"></span><b data-t="seiteKnopf"></b></span>
      </a>

      <div class="feld f-k1 kennzahl"><b class="zahl" id="k0">0</b><span id="k0-text"></span></div>
      <div class="feld f-k2 kennzahl"><b class="zahl" id="k1">0</b><span id="k1-text"></span></div>
      <div class="feld f-k3 kennzahl akzent"><b class="zahl" id="k2">0</b><span id="k2-text"></span></div>
    </section>

    <section class="feld liste" id="liste" aria-labelledby="liste-titel">
      <div class="liste-kopf">
        <h2 id="liste-titel" data-t="liste"></h2>
        <div class="filter" id="filter" role="group" aria-label="Anmeldungen filtern"></div>
      </div>
      <table>
        <thead><tr><th>Datum</th><th>Name</th><th>Ort</th><th>Wunsch</th><th>Stand</th></tr></thead>
        <tbody id="zeilen"></tbody>
      </table>
      <button class="knopf rahmen mehr" id="mehr" type="button" hidden></button>
      <p class="datenschutz" data-t="datenschutz"></p>
    </section>
  </main>

  <nav class="dock" aria-label="Schnell zu">
    <a class="dock-symbol" href="#oben" aria-label="Übersicht" title="Übersicht"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg></a>
    <a class="dock-symbol" href="#liste" aria-label="Liste" title="Liste"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg></a>
    <a class="dock-symbol" id="dock-seite" target="_blank" rel="noopener" aria-label="Deine Seite" title="Deine Seite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></a>
  </nav>

  <dialog id="d-passwort" aria-labelledby="d-passwort-titel">
    <form id="f-aendern" novalidate>
      <h2 id="d-passwort-titel">Passwort ändern</h2>
      <p class="text" data-t="neuesPasswortText"></p>
      <label class="eingabe">Neues Passwort<input name="passwort" type="password" autocomplete="new-password" minlength="10" required></label>
      <label class="eingabe">Noch einmal<input name="wiederholung" type="password" autocomplete="new-password" minlength="10" required></label>
      <div class="fehler" role="alert"></div>
      <p class="erfolg" role="status" hidden>Dein neues Passwort ist gespeichert.</p>
      <div class="dialog-knoepfe">
        <button class="knopf" type="submit">Speichern</button>
        <button class="knopf rahmen" type="button" id="d-schliessen">Schließen</button>
      </div>
    </form>
  </dialog>
</div>

<!-- Inhalt der Gruppe und Datenquelle. Für den Echtbetrieb: ../vendor/supabase.js und quelle-supabase.js -->
<script src="konfig-sport.js?v=20261110b"></script>
<script src="quelle-vorschau.js?v=20261110b"></script>
<script src="backoffice.js?v=20261110b"></script>
</body>
</html>
