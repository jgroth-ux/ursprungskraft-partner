<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Meine Seiten · Vorschau Partnerportal</title>
<!-- Nur für die lokale Vorschau: ein schlanker Nachbau des Portal-Rahmens, damit "Meine Seiten" ohne das ganze Portal
     und ohne Datenbank läuft. portal-stand-2026-11-11.css ist eine unveränderte Kopie von partner/portal.css (Stand 11.11.). -->
<link rel="stylesheet" href="/schriften/schriften.css">
<link rel="stylesheet" href="/vorschau/portal-stand-2026-11-11.css">
<link rel="stylesheet" href="/partner/seiten.css">
<style>
  .stand-wahl { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; padding: 8px 16px; font: 400 13px/20px var(--f-text); color: var(--c-muted); border-bottom: var(--haar); }
  .stand-wahl a { color: var(--c-ink); }
  .stand-wahl a[aria-current] { font-weight: 600; text-decoration: none; }
  .menue .marke { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
  .menue .marke b { font: 500 18px/22px var(--f-kopf); display: block; }
  .menue .marke small { color: var(--c-muted); }
</style>
</head>
<body>
<div id="wurzel">
  <p class="stand-wahl">Vorschau mit Beispieldaten, es wird nichts gesendet. Ausgangspunkt:
    <a href="?stand=gesperrt#seiten">Paket nicht gebucht</a>
    <a href="?stand=leer#seiten">Gebucht, noch nichts eingerichtet</a>
    <a href="?stand=fertig#seiten">Eingerichtet, Partner kümmert sich selbst</a>
    <a href="?stand=fertig&amp;leads=team#seiten">Eingerichtet, Daniel und Jasmin melden sich</a></p>
  <div class="app">
    <aside class="menue" aria-label="Menü">
      <a class="marke" href="#seiten"><span><b>Partnerportal</b><small>Vorschau</small></span></a>
      <nav>
        <a href="#seiten" data-ziel="seiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 8.5h17M7 12.5h6M7 15.5h4"/></svg><span>Meine Seiten</span></a>
        <a href="#seiten/info" data-ziel="seiten/info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg><span>Info zum Paket</span></a>
      </nav>
      <div class="unten"><b>Anna Beispiel</b><span>Vorschau</span></div>
    </aside>
    <header class="kopfleiste"><b>Meine Seiten</b></header>
    <main class="flaeche"><div id="inhalt"></div></main>
  </div>
</div>
<script>
// Nachbau der Helfer aus partner.js, nur was "Meine Seiten" braucht
(function () {
  const P = {
    links: '<path d="M15 5l-7 7 7 7"/>', pfeil: '<path d="M5 12h14M13 6l6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', zu: '<path d="M6 6l12 12M18 6L6 18"/>',
    kopie: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
    auge: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
    whatsapp: '<path d="M4 20l1.3-3.8A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2 2.5 4.3 4.6 4.7l1.2-1.2 1.7.8"/>',
    laden: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>', mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/>',
    telefon: '<path d="M6.5 3.5h3l1.5 4-2 1.5a11 11 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/>', schloss: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ico = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;
  const kopf = (titel, vorspann = '', knopf = '') => `<header class="seitenkopf"><h1>${esc(titel)}</h1>${knopf}${vorspann ? `<p class="vorspann">${esc(vorspann)}</p>` : ''}</header>`;
  function toast(text) {
    document.querySelector('.toast')?.remove();
    const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
    document.body.append(t); setTimeout(() => { t.classList.add('raus'); setTimeout(() => t.remove(), 220); }, 2600);
  }
  async function kopieren(text, hinweis) { try { await navigator.clipboard.writeText(text); toast(hinweis || 'Kopiert.'); } catch { prompt('Zum Kopieren markieren:', text); } }
  const stand = new URLSearchParams(location.search).get('stand') || 'gesperrt';
  const leads = new URLSearchParams(location.search).get('leads') || '';
  document.querySelectorAll('.stand-wahl a').forEach((a) => a.href.includes('stand=' + stand) && a.href.includes('leads=team') === (leads === 'team') && a.setAttribute('aria-current', 'true'));
  let lauf = 0;
  async function zeigen() {
    const [ziel, ...rest] = (location.hash.slice(1) || 'seiten').split('/');
    if (ziel !== 'seiten') { location.hash = 'seiten'; return; }
    const nr = ++lauf, box = document.getElementById('inhalt');
    document.querySelectorAll('[data-ziel]').forEach((a) => (a.dataset.ziel === [ziel, ...rest].join('/') ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    box.innerHTML = '<p class="laden">Einen Moment …</p>';
    await MeineSeiten.zeigen(box, rest, { esc, ico, kopf, toast, kopieren, vorschau: true, kontakt: 'info@ursprungskraft.net',
      p: { kurz: 'anna-beispiel', vorname: 'Anna', nachname: 'Beispiel' }, aktuell: () => nr === lauf, sitzung: () => 'vorschau' });
    window.scrollTo(0, 0);
  }
  addEventListener('hashchange', zeigen);
  addEventListener('DOMContentLoaded', zeigen);
})();
</script>
<script src="/p/farben.js"></script>
<script src="/partner/seiten.js"></script>
</body>
</html>
