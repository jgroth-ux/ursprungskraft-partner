<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einblendungen LeveLuk K8</title>
<!--
  Einblendungen für das untere Bilddrittel (Test mit den Gläsern), 1920 x 1080, transparenter Hintergrund.
  Rendern:  node render-einblendungen.js   (PNG mit Transparenz in png-einblendungen/)

  Pro Glas eine <section>. Felder:
    data-datei  Dateiname der PNG
    data-wert   große Zahl links
    data-name   Wort darunter
    data-ph     ein Wert: senkrechter Strich an dieser Stelle
    data-von / data-bis   ein Bereich: Rahmen um diese Felder
-->
<style>
  @font-face { font-family: "Jost"; font-weight: 500; src: url("schriften/jost-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 500; src: url("schriften/inter-latin-500-normal.woff2") format("woff2"); }
  :root { --grund: #FAF7F0; --text: #2F3524; --text2: #5F6650; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }
  .einblendung { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .leiste { position: absolute; left: 100px; right: 100px; bottom: 70px; height: 190px; background: var(--grund);
    border-radius: 4px; padding: 0 40px; display: grid; grid-template-columns: 440px 1fr; align-items: center; gap: 40px; }
  .wert { font-family: "Jost"; font-weight: 500; font-size: 80px; line-height: 1; color: var(--text); }
  .name { font-family: "Inter"; font-weight: 500; font-size: 34px; margin-top: 10px; color: var(--text2); white-space: nowrap; }
  .bandrahmen { position: relative; }
  .band { display: grid; grid-template-columns: repeat(7, 1fr); height: 96px; border-radius: 4px; overflow: hidden; }
  .band div { display: flex; align-items: center; justify-content: center; font-family: "Jost"; font-weight: 500; font-size: 48px; }
  .zeiger { position: absolute; top: -22px; bottom: -22px; width: 0; border-left: 6px solid var(--text); }
  .bereich { position: absolute; top: -12px; bottom: -12px; border: 6px solid var(--text); border-radius: 6px; }
</style>
</head>
<body>

<section class="einblendung" data-datei="einblendung-1-leitungswasser" data-wert="7 bis 8" data-name="Leitungswasser" data-von="7" data-bis="8"></section>
<section class="einblendung" data-datei="einblendung-2-kangenwasser" data-wert="9,5" data-name="Kangenwasser" data-ph="9.5"></section>
<section class="einblendung" data-datei="einblendung-3-flaschenwasser" data-wert="ca. 8,5" data-name="basisches Flaschenwasser" data-ph="8.5"></section>
<section class="einblendung" data-datei="einblendung-4-sprudelwasser" data-wert="sauer" data-name="Sprudelwasser" data-von="4" data-bis="6"></section>
<section class="einblendung" data-datei="einblendung-5-abwasser" data-wert="ca. 4,5" data-name="Abwasser der Maschine" data-ph="4.5"></section>

<script>
// Farben wie die Farbtabelle beim Tropfentest (pH 4 bis 10)
const FELDER = [["4","#FDAF05","#2F3524"],["5","#F8C909","#2F3524"],["6","#D5B60E","#2F3524"],["7","#188647","#FFFFFF"],
                ["8","#092384","#FFFFFF"],["9","#4958BF","#FFFFFF"],["10","#431376","#FFFFFF"]];
const pos = ph => (ph - 3.5) / 7 * 100;   // Feld n reicht von n-0,5 bis n+0,5, in Prozent der Bandbreite
document.fonts.ready.then(() => {
  document.querySelectorAll(".einblendung").forEach(e => {
    e.innerHTML = `<div class="leiste"><div><div class="wert"></div><div class="name"></div></div>
      <div class="bandrahmen"><div class="band"></div></div></div>`;
    e.querySelector(".wert").textContent = e.dataset.wert;
    e.querySelector(".name").textContent = e.dataset.name;
    const band = e.querySelector(".band"), rahmen = e.querySelector(".bandrahmen");
    FELDER.forEach(([w, bg, fg]) => { const d = document.createElement("div"); d.textContent = w;
      d.style.background = bg; d.style.color = fg; band.appendChild(d); });
    if (e.dataset.ph) {
      const z = document.createElement("div"); z.className = "zeiger";
      z.style.left = `calc(${pos(+e.dataset.ph)}% - 3px)`; rahmen.appendChild(z);
    } else {
      const b = document.createElement("div"); b.className = "bereich";
      b.style.left = `calc(${pos(+e.dataset.von - 0.5)}% - 6px)`;
      b.style.width = `calc(${(+e.dataset.bis - +e.dataset.von + 1) / 7 * 100}% + 12px)`;
      rahmen.appendChild(b);
    }
  });
  window.fertig = true;
});
</script>
</body>
</html>
